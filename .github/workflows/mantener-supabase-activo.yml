# Mantiene activo el proyecto de Supabase de la presentación.
# En el plan gratuito, Supabase pausa los proyectos tras 7 días sin actividad.
# Esta tarea hace una consulta de solo lectura cada 3 días; no modifica datos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 13 */3 * *"   # cada 3 días, 8:00 a. m. hora de Lima
  workflow_dispatch:          # también se puede ejecutar a mano desde la pestaña Actions

permissions:
  contents: write             # solo para el commit vacío de abajo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase (solo lectura)
        env:
          # Clave pública (publishable): es la misma que ya está en index.html
          SUPABASE_URL: https://slenrqtkoqdyveprxhpk.supabase.co
          SUPABASE_KEY: sb_publishable_WShPGMzfAut0Vk_dB7xTIQ_RCwRlhR-
        run: |
          for intento in 1 2 3; do
            code=$(curl -s -o respuesta.json -w "%{http_code}" --max-time 60 \
              "$SUPABASE_URL/rest/v1/bienvenida_estado?select=id" -H "apikey: $SUPABASE_KEY")
            echo "Intento $intento: HTTP $code"; cat respuesta.json; echo
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase no respondió. Revisa si el proyecto está pausado en supabase.com"
          exit 1

      # GitHub desactiva las tareas programadas de repositorios sin cambios durante 60 días.
      # Si el último commit tiene más de 45 días, se agrega un commit vacío para evitarlo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Evitar que GitHub desactive esta tarea
        run: |
          ultimo=$(git log -1 --format=%ct)
          dias=$(( ( $(date +%s) - ultimo ) / 86400 ))
          echo "Días desde el último commit: $dias"
          if [ "$dias" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activa la tarea programada"
            git push
          fi
